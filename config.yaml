# ============================================================
# polymarket-kronos 交易框架 —— 唯一配置源（config.py 读取）
#
# 【切换策略】只改顶层 strategy 字段 + 重启：
#   strategy: momentum        # 当前内置策略
#
# 【新增策略】三步，无需改引擎/执行层代码：
#   1) src/pmbot/strategies/ 写策略类继承 Strategy + @register("名字")
#   2) strategies/__init__.py 加一行 import（触发注册）
#   3) config.yaml 加「名字: {...}」分节放策略专属参数（覆盖下方通用默认）
#   策略构造收到 StrategyConfig（market_interval / threshold_pct），
#   其余参数从自己分节读或由引擎层（EngineConfig）消费。
#
# 【多标的并行】每个标的一个进程（--symbol 覆盖 symbols[0]）：
#   uv run python -m pmbot.run --symbol BTC --data-dir data_btc --poll 2
#   数据/pid/日志按 data_dir 隔离；聚合面板: uv run python scripts/multi_panel.py
# ============================================================

strategy: momentum     # 策略名（切换策略只改这一行）
market_interval: 5m        # 市场/K线频率：5m / 15m / 1h（Polymarket slug 与窗口对齐随此）

# ---------- momentum 策略（动量/Breakout：穿越阈值后同向入场） ----------
# 研究依据：docs/reports/momentum_strategy.md —— 窗口内标的强动量
# （穿越阈值后方向延续 72-97%，大样本 robust）；执行专注低价档：
# 首日实证穿越后 Polymarket 秒级极化、taker 追高档 EV 负；
# 真实交易分档（10 笔）>0.50 档累计 -3.72、<0.50 全赢 → max_entry_price 0.50。
momentum:
  symbols: [BTC, ETH, SOL, XRP, DOGE, BNB]  # 交易标的池（HYPE 无 Binance K线不可用；
                                            # ZEC 阈值 0.20 才压到 80% 命中线以下水平，缓议）
                                            # BTC 重新纳入（2026-09-11，原为纯信号源不下单）：
                                            # 秒级盘口实测（crossing_ask.py, 9/5 录制 2.9 天 849 窗）穿越瞬间
                                            # ask 中位 0.51、≤0.60 占 62%（小币同期实际仅 12%），且穿越后
                                            # +1s~+10s 不漂移 → 盘口钝、延迟容忍度高；cap 0.60 下成交机会充足。
                                            # 旧降级依据（7 笔全亏 -3.26）是 cap 更宽时期的高价追单，非 BTC 无 edge。
  amount_per_trade: 1        # 每注金额（USDC）。市价单(FOK) **无** 5 股下限：实测他人以 $1.05
                             # 成交 140+ 笔 1.2 股单（py-clob-client #301）；5 股下限只针对
                             # GTC/GTD 限价单（validate_limit_order 守的就是这条，保持不变）。
                             # 市价单可能有**美元金额**下限（未确证具体值）——若实盘出现
                             # "Size ... lower than the minimum" 拒单，先提到 $1.05 试。
  threshold_pct: 0.08        # 穿越阈值 %%：Binance 相对窗口开盘偏离此值 → 同向入场
                             # （5m 回测 EV +0.15~0.40/笔；0.05-0.10 均显著，0.08 平衡触发率与命中率）
  # 分标的阈值机制已删除（2026-09-10 实盘证伪：升阈致 0 成交，见
  # docs/adr/0004-revert-per-symbol-threshold.md；阈值调优以成交率为目标）
  btc_contradiction_pct: 0.08   # BTC 反向矛盾过滤：标的穿越方向与 BTC 反向时跳过入场
                                # （30 天：反向命中率 41% vs 平均 80%；昨晚 5 笔反向 -3.09；见 btc_cross_asset_signal.md）
  take_profit: 0.95          # 绝对止盈价：价格到 0.95 止盈（接近持有到结算，赢收 1.0 输收 0，redeem 无费）
  stop_loss: 0.0             # 关闭止损（动量持有到结算；极端反转由熔断兜底）
  exit_loss_before_end_sec: 0   # 关闭浮亏离场（持有到结算，窗口末不卖）
  hold_until_end_sec: 60     # 窗口结束前浮盈 → 持有到结算（默认开启）
  no_entry_before_end_sec: 60   # 窗口结束前 60s 禁入（穿越太晚来不及结算）
  open_delay_sec: 0         # 开仓延迟：momentum 穿越常发生在窗口早期，延迟 = 盘口被 MM 极化后只能拒单（0=关闭）
  max_entry_price: 0.64      # 入场价上限（2026-09-12 由 0.65 微调：43h/1065 样本分档 EV 显示
                             # 0.65-0.70 转负（-0.107）；昨晚启动后实际成交 entry=0.65 档 30 笔
                             # -3.80，而 0.61-0.64 档 60 笔 +10.14 → 封顶边缘是坑，收紧一档。
                             # 历史：9/10 分档 0.50-0.55 +0.475 / 0.55-0.60 +0.340 /
                             # 0.60-0.65 +0.178 / 0.65-0.70 转负 -0.108。旧值 0.50 源自 10 笔小样本。）
  taker_fee_pct: 0.03        # dry-run 模拟 taker 手续费率（按成交金额；比真实费 1.7-2.5%% 保守）
  max_consecutive_losses: 8  # 连亏 N 笔熔断
  max_daily_loss: 20         # 单日亏损 N USDC 熔断