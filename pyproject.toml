[project]
name = "pmbot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "py-clob-client-v2>=1.1.0",
    "python-dotenv>=1.2.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]